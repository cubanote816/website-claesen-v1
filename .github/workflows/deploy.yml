name: Build and Deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [backend_update]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: [self-hosted, linux, prod]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Sync backend content
        run: npm run sync:prod
        env:
          PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}

      - name: Type check
        run: npx astro check

      - name: Build
        run: |
          npm run build:prod
          mkdir -p dist/v1-media
          cp -r public/v1-media/. dist/v1-media/ || true
        env:
          PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
          PUBLIC_USE_STATIC_CACHE: 'true'
          ASTRO_BASE_PATH: /

      - name: Deploy via rsync
        run: |
          rsync -az --delete \
            --exclude='.well-known' \
            dist/ \
            bert@192.168.60.10:/var/www/backend.claesen-verlichting.be/public/