    <!-- Sri Lanka -->
    <path d="M717,242 L722,236 L728,239 L722,247 Z"/>

    <!-- Southeast Asia peninsula -->
    <path d="M789,206 L797,228 L803,239 L808,228 L806,211 Z"/>

    <!-- Japan -->
    <path d="M867,144 L872,136 L881,133 L883,144 L878,156 L869,153 Z"/>

    <!-- Taiwan -->
    <path d="M836,189 L839,183 L844,186 L842,194 Z"/>

    <!-- Philippines (simplified) -->
    <path d="M842,214 L847,206 L850,211 L847,219 Z"/>

    <!-- Indonesia (Java/Sumatra simplified) -->
