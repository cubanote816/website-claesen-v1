    <!-- Borneo -->
    <path d="M811,244 L822,236 L833,239 L833,256 L822,264 L811,256 Z"/>

    <!-- Australia -->
    <path d="M864,281 L844,294 L819,308 L814,344 L825,353 L878,356 L906,356 L919,350 L925,325 L908,281 L878,294 Z"/>

    <!-- New Zealand North Island -->
    <path d="M981,336 L986,328 L994,331 L989,342 Z"/>
    <!-- New Zealand South Island -->
    <path d="M978,350 L981,342 L989,345 L986,358 Z"/>

    <!-- Antarctica (sliver at bottom) -->
    <path d="M0,478 L83,469 L167,464 L250,469 L333,464 L417,469 L500,461 L583,467 L667,461 L750,464 L833,467 L917,461 L1000,469 L1000,500 L0,500 Z"/>

  </g>
</svg>
