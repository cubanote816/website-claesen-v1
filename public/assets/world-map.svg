    <!-- Madagascar -->
    <path d="M628,289 L633,275 L642,278 L644,297 L642,311 L631,314 Z"/>

    <!-- Middle East / Arabian Peninsula -->
    <path d="M569,161 L608,200 L653,211 L656,189 L647,172 L636,172 L625,186 L619,197 L608,197 L617,181 L619,164 Z"/>

    <!-- Asia (main body) -->
    <path d="M600,128 L636,144 L650,172 L669,178 L686,192 L719,189 L747,189 L800,222 L858,156 L900,128 L950,100 L1000,64 L1000,0 L889,44 L806,33 L694,42 L639,56 L611,83 L583,83 Z"/>

    <!-- Indian Subcontinent (protrusion south) -->
