<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1f3d"/>
      <stop offset="100%" stop-color="#0d2d52"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c47d3a"/>
      <stop offset="100%" stop-color="#a85f22"/>
    </linearGradient>
    <filter id="soft" x="-2%" y="-2%" width="104%" height="104%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ocean background -->
  <rect width="1000" height="500" fill="url(#ocean)"/>

  <!-- Grid lines: longitude -->
  <g stroke="#4a7fa5" stroke-width="0.4" opacity="0.25">
    <line x1="83" y1="0" x2="83" y2="500"/>
    <line x1="167" y1="0" x2="167" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="333" y1="0" x2="333" y2="500"/>
    <line x1="417" y1="0" x2="417" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="583" y1="0" x2="583" y2="500"/>
    <line x1="667" y1="0" x2="667" y2="500"/>
    <line x1="750" y1="0" x2="750" y2="500"/>
    <line x1="833" y1="0" x2="833" y2="500"/>
    <line x1="917" y1="0" x2="917" y2="500"/>
  </g>
  <!-- Grid lines: latitude -->
  <g stroke="#4a7fa5" stroke-width="0.4" opacity="0.25">
    <line x1="0" y1="83" x2="1000" y2="83"/>
    <line x1="0" y1="167" x2="1000" y2="167"/>
    <line x1="0" y1="333" x2="1000" y2="333"/>
    <line x1="0" y1="417" x2="1000" y2="417"/>
  </g>
  <!-- Equator -->
  <line x1="0" y1="250" x2="1000" y2="250" stroke="#6aabcc" stroke-width="0.6" opacity="0.35"/>

  <!-- Continents -->
  <g fill="url(#land)" stroke="#d49050" stroke-width="0.5" stroke-opacity="0.4" filter="url(#soft)">

    <!-- Greenland -->
    <path d="M200,25 L225,14 L258,18 L278,28 L286,44 L278,67 L261,72 L236,72 L208,64 L197,50 Z"/>

    <!-- Iceland -->
    <path d="M442,72 L453,64 L469,64 L475,72 L467,81 L450,81 Z"/>

    <!-- North America -->
    <path d="M33,56 L83,44 L139,44 L167,44 L200,40 L236,72 L278,67 L347,100 L333,122 L308,136 L283,153 L278,178 L258,208 L250,208 L239,197 L222,189 L208,189 L194,178 L178,164 L156,147 L150,117 L114,81 L69,97 L33,81 Z"/>

    <!-- Central America connector -->
    <path d="M258,208 L264,219 L275,219 L283,208 Z"/>

    <!-- Cuba -->
    <path d="M264,200 L278,197 L281,203 L272,206 Z"/>

    <!-- South America -->
    <path d="M286,228 L325,217 L356,222 L406,267 L400,281 L386,306 L353,344 L325,378 L314,406 L308,403 L297,375 L281,306 L278,264 L283,242 Z"/>

    <!-- Europe -->
